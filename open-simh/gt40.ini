; GT40 graphics terminal: a PDP-11/05 with a VT11 display and a VR14 CRT,
; connected to a remote host over its DL11 serial line.
;
; Usage: open-simh-pdp11 /usr/share/open-simh/gt40.ini HOST PORT
;
; The settings follow the pidp10 package's conf/gt40.simh, except that the
; DL11 only connects out to HOST:PORT (the PiDP-10 ITS GT40 line is 10019)
; instead of also listening for connections.
set cpu 11/05
set lpt disabled
set dz disabled
set rk disabled
set rl disabled
set hk disabled
set rx disabled
set rp disabled
set rq disabled
set tm disabled
set tq disabled
set cpu 16k
set tti 8b
set dli enabled
set dlo enabled
set dli lines=1
set dli address=17775610
set dlo0 8b
attach dli Line=0,Connect=%1:%2
set vt enabled
set vt crt=vr14
set vt scale=1
set vt address=17772000
set vt vec=320
set vt keyboard=nospacewar
dep sr 0
; Use the GT40 bootstrap ROM image from pidp10 when it is installed, otherwise
; the copy built into the simulator.
if not exist "/usr/share/pidp10/conf/bootvt.img" goto builtin
set rom enabled
set rom0 address=17766000
attach rom0 /usr/share/pidp10/conf/bootvt.img
boot rom0
goto end
:builtin
boot -40 vt
:end
