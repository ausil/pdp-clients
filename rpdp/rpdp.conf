# Settings for rpdp, the remote terminal launcher for PiDP-10, -11, -8 and -1.
# Per-user overrides go in ~/.config/rpdp.conf (same syntax).

# Name or address of the PiDP-10.  A bare name such as "pidp10" gets ".local"
# appended (mDNS); use a dotted name or an IP address to avoid that.
PIDP_HOST="pidp10"

# Host of the PiDP-11, used by the PDP-11 terminals (vt100).  Defaults to
# PIDP_HOST.  Its 2.11BSD DZ11 mux listens on port 4000.
#PIDP11_HOST="pidp11"

# Hosts of the PiDP-8 (TSS/8, telnet port 4000) and the PiDP-1 (Soroban
# typewriter, port 1041).  Each defaults to PIDP_HOST.
#PIDP8_HOST="pidp8"
#PIDP1_HOST="pidp1"

# Account on the PiDP-10 used by plain `rpdp` (ssh in and run `pdp`).
PIDP_USER="pi"

# Ports the terminals connect to.  Uncomment and change to match your
# emulator setup (these are the PiDP-10 ITS defaults).
#PORT_CON=1025
#PORT_TELCON=1025
#PORT_TVCON=11100
#PORT_VT52=10018
#PORT_VT05=10018
#PORT_TEK=10017
#PORT_DP3300=10020
#PORT_IMLAC=10003
#PORT_VT100=10018

# The other machines have a single terminal port for every terminal type.
#PORT_11=4000
#PORT_8=4000
#PORT_1=1041

# PDP-1 Type 30 display ports (rpdp type30, rpdp type30b).
#PORT_TYPE30=3400
#PORT_TYPE30B=3401
